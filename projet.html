  <script>
    // .js : les scripts tournent. .motion : animations complètes, toujours activées
    // (même si l'ordinateur demande de réduire les animations).
    // data-theme : thème clair par défaut, ou sombre si la personne l'a choisi (choix gardé).
    (function (h) {
      h.classList.add("js", "motion");
      var theme = null;
      try { theme = localStorage.getItem("pf-theme"); } catch (e) {}
      if (theme !== "dark" && theme !== "light") theme = "light"; // le thème clair est le thème principal
      h.setAttribute("data-theme", theme);
      if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#1d1e2c");
      setTimeout(function () { if (!window.PF) h.classList.remove("js"); }, 3000);
    })(document.documentElement);
  </script>
