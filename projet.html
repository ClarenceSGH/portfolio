<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Étude de cas | Clarence Seguy-Houel</title>
  <meta name="description" content="Étude de cas UX/UI par Clarence Seguy-Houel.">
  <meta name="theme-color" content="#0c0c0e">

  <!-- Icône du site (onglet, favoris, écran d'accueil du téléphone) -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Geist:wght@300..700&family=Geist+Mono:wght@400..500&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.20/dist/lenis.css">
  <link rel="stylesheet" href="css/style.css">

  <script>
    // .js : les scripts tournent. .motion : animations complètes, toujours activées
    // (même si l'ordinateur demande de réduire les animations).
    document.documentElement.classList.add("js", "motion");
    setTimeout(function () { if (!window.PF) document.documentElement.classList.remove("js"); }, 3000);
  </script>
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>

  <nav class="nav" data-nav aria-label="Navigation principale">
    <ul class="nav__list">
      <li><a href="index.html#projets"><span class="roll"><span data-text="Projets">Projets</span></span></a></li>
      <li><a href="index.html#a-propos"><span class="roll"><span data-text="À propos">À propos</span></span></a></li>
    </ul>
    <!-- la signature (logo) : remplacée par un dessin vectoriel animable au chargement -->
    <a class="nav__brand" href="index.html" aria-label="Clarence Seguy-Houel, accueil" data-sig>
      <img src="assets/signature.svg" alt="" width="581" height="492">
    </a>
    <ul class="nav__list nav__list--right">
      <li><a href="index.html#contact"><span class="roll"><span data-text="Contact">Contact</span></span></a></li>
    </ul>
  </nav>

  <!-- Le contenu est généré à partir de js/projects.js -->
  <main id="contenu" data-case></main>

  <footer class="footer">
    <!-- la signature s'écrit en grand au fil du scroll -->
    <div class="footer__sig" data-footer-sig aria-hidden="true"></div>
    <div class="footer__bar">
      <p>© <span data-year>2026</span> Clarence Seguy-Houel</p>
      <a href="index.html#contact">Contact <i class="ph ph-arrow-up-right"></i></a>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/signature.js"></script>
  <script src="js/common.js"></script>
  <script src="js/project.js"></script>
</body>
</html>
